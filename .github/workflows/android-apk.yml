name: Build Bongo Cat Android APK

on:
  push:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'Bongo-Cat-Mobile-Android-Nativo.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 35 SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          unzip -q Bongo-Cat-Mobile-Android-Nativo.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/Bongo-Cat-Mobile-arquivos/android-nativo" >> "$GITHUB_ENV"

      - name: Fix accessibility key-filter registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path("extracted/Bongo-Cat-Mobile-arquivos/android-nativo/app/src/main")
          xml = base / "res/xml/bongo_accessibility.xml"
          s = xml.read_text()
          if 'android:accessibilityFlags=' not in s:
              s = s.replace(
                  'android:accessibilityFeedbackType="feedbackGeneric"',
                  'android:accessibilityFeedbackType="feedbackGeneric"\n    android:accessibilityFlags="flagRequestFilterKeyEvents"'
              )
          xml.write_text(s)

          kt = base / "java/com/bongocat/mobile/CatAccessibilityService.kt"
          s = kt.read_text()
          s = s.replace(
              'override fun onServiceConnected() { super.onServiceConnected() }',
              '''override fun onServiceConnected() {
                  super.onServiceConnected()
                  serviceInfo = serviceInfo.apply {
                      flags = flags or android.accessibilityservice.AccessibilityServiceInfo.FLAG_REQUEST_FILTER_KEY_EVENTS
                  }
              }'''
          )
          kt.write_text(s)
          print("Accessibility key-filter flag configured in XML and at service connection.")
          PY

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/Bongo-Cat-Mobile-arquivos/android-nativo/app/build.gradle.kts")
          s = p.read_text()
          marker = "android {"
          config = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if 'jvmTarget = "17"' not in s:
              if marker not in s:
                  raise SystemExit("Bloco android não encontrado em app/build.gradle.kts")
              s = s.replace(marker, config, 1)
              p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Verify APK
        run: |
          APK="extracted/Bongo-Cat-Mobile-arquivos/android-nativo/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bongo-Cat-Mobile-debug-apk
          path: extracted/Bongo-Cat-Mobile-arquivos/android-nativo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
