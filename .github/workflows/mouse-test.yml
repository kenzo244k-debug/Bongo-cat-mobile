name: Build Bongo Cat Mouse Test APK
on:
  push:
    branches: [ mouse-test ]
    paths:
      - 'mouse-test/**'
      - '.github/workflows/mouse-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build test APK
        run: gradle --no-daemon --stacktrace assembleDebug
        working-directory: mouse-test
      - name: Verify APK
        run: |
          APK="mouse-test/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: Bongo-Cat-Mouse-Test-APK
          path: mouse-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
